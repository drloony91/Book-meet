services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: book_meet_test
      MYSQL_USER: book_meet_test
      MYSQL_PASSWORD: book_meet_test_password
      MYSQL_ROOT_PASSWORD: book_meet_test_root_password
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -ubook_meet_test -pbook_meet_test_password -D book_meet_test -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - mysql-test-data:/var/lib/mysql

volumes:
  mysql-test-data:
